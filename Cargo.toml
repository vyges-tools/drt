[package]
name = "vyges-drt"
version = "0.1.56"
edition = "2021"
description = "Detailed routing: pin access first — each pin's access points, reproducible bit for bit."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/drt"
build = "build.rs"
readme = "README.md"
keywords = ["eda", "routing", "asic", "pin-access"]
categories = ["science", "command-line-utilities"]

[features]
# The command-line entry built into the library too (`cli_main`), for the suite binaries
# that link every engine and run the one they are invoked as.
suite = ["odb"]
# The design database reader. OFF by default: the geometry and the access-point rules build and
# test with no C++ dependency.
odb = ["dep:vyges-opendb", "dep:vyges-events", "dep:vyges-loom", "dep:mimalloc", "dep:libmimalloc-sys", "dep:serde_json"]

[dependencies]
# `--describe` adds the debug-group table to the descriptor.
serde_json = { version = "1", optional = true }
# The search-and-repair batches: each batch's workers routed in parallel (they only read the
# design), written back in batch order, as FlexDR::processWorkersBatch / endWorkersBatch do.
rayon = "1"
vyges-events = { git = "https://github.com/vyges-tools/events", branch = "main", default-features = false, optional = true }
vyges-opendb = { git = "https://github.com/vyges-tools/opendb.git", branch = "repin-f11b4276", optional = true, features = ["gen-write"] }
# The suite's one rule for the worker-thread count (`vyges_loom::threads`).
vyges-loom = { git = "https://github.com/vyges-tools/loom", branch = "repin-f11b4276", optional = true }

# The binary's global allocator. The reference build links tcmalloc for all of its code
# (BUILD.bazel `malloc = @tcmalloc`), not the system allocator; mimalloc measured fastest and
# smallest of tcmalloc / jemalloc / mimalloc on a like-for-like trial. Pinned exactly:
# libmimalloc-sys 0.1.44 bundles mimalloc v2 by default (0.1.45 on default to v3).
mimalloc = { version = "=0.1.48", default-features = false, optional = true }
libmimalloc-sys = { version = "=0.1.44", default-features = false, optional = true }

# On Linux the allocator also REPLACES malloc/free process-wide (`override`), so C++ code linked
# into the binary allocates through it too, as the reference's statically linked tcmalloc does for
# all of its code. Not on macOS, where the system zone allocator is left alone.
[target.'cfg(target_os = "linux")'.dependencies]
libmimalloc-sys = { version = "=0.1.44", default-features = false, features = ["override"], optional = true }

[dev-dependencies]
# The `--describe` contract tests parse the descriptor.
serde_json = "1"

[lib]
name = "vyges_drt"
path = "src/lib.rs"

[[bin]]
name = "vyges-drt"
path = "src/bin/vyges-drt.rs"
required-features = ["odb"]

# Local development against the sibling checkouts.
[patch."https://github.com/vyges-tools/opendb.git"]
vyges-opendb = { path = "../vyges-tools-opendb" }

[patch."https://github.com/vyges-tools/opendb-lib.git"]
vyges-opendb-lib = { path = "../vyges-tools-opendb-lib" }

# The reference is built -O3 with link-time optimisation (Bazel --config=release). LTO and one
# codegen unit let calls inline across crates; by language rule neither changes a result.
[profile.release]
lto = "fat"
codegen-units = 1
