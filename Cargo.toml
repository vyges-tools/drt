[package]
name = "vyges-drt"
version = "0.1.37"
edition = "2021"
description = "Detailed routing: pin access first — each pin's access points, reproducible bit for bit."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/drt"
build = "build.rs"
readme = "README.md"
keywords = ["eda", "routing", "asic", "pin-access"]
categories = ["science", "command-line-utilities"]

[features]
# The design database reader. OFF by default: the geometry and the access-point rules build and
# test with no C++ dependency.
odb = ["dep:vyges-opendb", "dep:vyges-events"]

[dependencies]
vyges-events = { git = "https://github.com/vyges-tools/events", branch = "main", default-features = false, optional = true }
vyges-opendb = { git = "https://github.com/vyges-tools/opendb.git", branch = "main", optional = true, features = ["gen-write"] }

[dev-dependencies]
# The `--describe` contract tests parse the descriptor.
serde_json = "1"

[lib]
name = "vyges_drt"
path = "src/lib.rs"

[[bin]]
name = "vyges-drt"
path = "src/bin/vyges-drt.rs"
required-features = ["odb"]

# Local development against the sibling checkouts.
[patch."https://github.com/vyges-tools/opendb.git"]
vyges-opendb = { path = "../vyges-tools-opendb" }

[patch."https://github.com/vyges-tools/opendb-lib.git"]
vyges-opendb-lib = { path = "../vyges-tools-opendb-lib" }
