[package]
name = "vyges-drt"
version = "0.1.0"
edition = "2021"
description = "Detailed routing: pin access first — each pin's access points, reproducible bit for bit."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/drt"

[features]
# The design database reader. OFF by default: the geometry and the access-point rules build and
# test with no C++ dependency.
odb = ["dep:vyges-opendb"]

[dependencies]
vyges-opendb = { git = "https://github.com/vyges-tools/opendb.git", branch = "main", optional = true }

[lib]
name = "vyges_drt"
path = "src/lib.rs"

# Local development against the sibling checkouts.
[patch."https://github.com/vyges-tools/opendb.git"]
vyges-opendb = { path = "../vyges-tools-opendb" }

[patch."https://github.com/vyges-tools/opendb-lib.git"]
vyges-opendb-lib = { path = "../vyges-tools-opendb-lib" }
