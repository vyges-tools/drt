# Build & test on every push to main and on pull requests (plus manual dispatch).
#
# Three jobs:
#   - `lib`: the default features, no C++ — the geometry and every pin-access rule build and test
#     on their own, and must keep doing so.
#   - `cli`: the `vyges-drt` command, which reads and writes the design database through
#     vyges-opendb, which statically links its C++ library (built from source). That needs the
#     sibling layout below and a C toolchain.
#   - `docs`: the mdBook.
#
# ⚠️ The sibling checkouts are not optional decoration: every `[patch]` path in Cargo.toml must
# resolve, and a patch whose path is missing is a hard `failed to load source` rather than a
# fall-back to the git source.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lib:
    name: library (no C++)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyges-tools-drt
    steps:
      - uses: actions/checkout@v4
        with:
          path: vyges-tools-drt
      # The [patch] paths must resolve even when the features that use them are off.
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/opendb
          path: vyges-tools-opendb
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/opendb-lib
          path: vyges-tools-opendb-lib
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Test
        run: cargo test --verbose
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

  cli:
    name: command (build & test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyges-tools-drt
    steps:
      - uses: actions/checkout@v4
        with:
          path: vyges-tools-drt
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/opendb
          path: vyges-tools-opendb
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/opendb-lib
          path: vyges-tools-opendb-lib

      - name: Toolchain
        # Boost (headers) + zlib only; fmt/spdlog/abseil are built from source by the C++ build.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git bison libboost-dev libboost-iostreams-dev libbz2-dev zlib1g-dev

      - uses: dtolnay/rust-toolchain@stable

      # No --locked: the [patch] resolves the opendb crates to the freshly checked-out siblings @
      # main, which the committed lock file cannot know — let Cargo resolve.
      - name: Build
        run: cargo build --release --features odb --verbose
      - name: Test
        run: cargo test --release --features odb --verbose
      - name: Smoke the contract
        run: |
          ./target/release/vyges-drt --version
          ./target/release/vyges-drt --describe | python3 -c 'import json,sys; d=json.load(sys.stdin); assert d["name"]=="drt" and d["schema"]=="vyges-tool-descriptor/1.1", d'
          # A design with nothing routed is VACUOUS and must exit 2, not 0.
          set +e; ./target/release/vyges-drt pin_access --lef tests/data/tiny.lef --def tests/data/tiny-no-nets.def --out /tmp/v.odb; rc=$?; set -e
          test "$rc" = 2

  docs:
    name: book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSL https://github.com/rust-lang/mdBook/releases/download/v0.5.3/mdbook-v0.5.3-x86_64-unknown-linux-gnu.tar.gz | tar -xz -C "$HOME/.local/bin"
          "$HOME/.local/bin/mdbook" build docs
